apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    headerStyle: clean
    theme: dark
    color: slate
    favicon: https://github.com/mattjmorrison-homelab.png

  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.morrisons.site
            icon: argo-cd.png
            description: GitOps continuous delivery
        - OpenBao:
            href: https://openbao.morrisons.site
            icon: https://openbao.morrisons.site/ui/favicon.svg
            description: Secrets management
        - Zot:
            href: https://registry.morrisons.site
            icon: zot-registry.png
            description: Container registry
        - Backstage:
            href: https://backstage.morrisons.site
            icon: backstage.png
            description: Service catalog and dependency tracking

    - Monitoring:
        - Grafana:
            href: https://grafana.morrisons.site/d/homelab-overview/homelab-overview
            icon: grafana.png
            description: Dashboards and metrics
        - Prometheus:
            href: https://prometheus.morrisons.site
            icon: prometheus.png
            description: Metrics collection
        - Alertmanager:
            href: https://alertmanager.morrisons.site
            icon: alertmanager.png
            description: Alert routing

    - Home:
        - Home Assistant:
            href: https://home-assistant.morrisons.site
            icon: home-assistant.png
            description: Home automation
        - Pi-hole:
            href: https://pihole.morrisons.site/admin
            icon: pi-hole.png
            description: Network-wide ad blocking

    - Applications:
        - HDMI Switch:
            href: https://hdmi-switch.morrisons.site
            icon: https://hdmi-switch.morrisons.site/favicon.png
            description: HDMI Switch Controller
        - GraphQL Router:
            href: https://graphql.morrisons.site
            icon: si-apollographql
            description: Apollo Router GraphQL supergraph

  bookmarks.yaml: |
    - External:
        - GitHub:
            - href: https://github.com/mattjmorrison-homelab
              icon: github-light.png
              description: Homelab source repos
        - Open PRs:
            - href: https://github.com/pulls?q=is%3Aopen+is%3Apr+org%3Amattjmorrison-homelab
              icon: github-light.png
              description: All open pull requests across the org
        - Discord:
            - href: https://discord.com/channels/1534069041143218238/1534069041143218242
              icon: discord.png
              description: Alerts and notifications
        - Cloudflare:
            - href: https://dash.cloudflare.com/
              icon: cloudflare.png
              description: DNS and tunnel management
        - Raspberry Pi OS:
            - href: https://www.raspberrypi.com/software/operating-systems/
              icon: raspberry-pi.png
              description: Pi OS images and downloads
    - Docs:
        - k3s:
            - href: https://docs.k3s.io/
              icon: k3s.png
        - Helm:
            - href: https://helm.sh/docs/
              icon: si-helm-#ffffff
        - NixOS:
            - href: https://nixos.org/manual/nixos/stable/
              icon: nixos.png

  widgets.yaml: ""
